[project]
name = "fantasy-bracket"
version = "0.1.0"
description = ""
authors = [{name = "Mitchell Brooks", email = "MitchellBrooks@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "supabase>=1.0.2",
    "pandas>=1.5.3",
    "pyquery>=2.0.1",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.0",
]

[tool.uv]
package = true

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fantasy_bracket", "data/pipeline"]
